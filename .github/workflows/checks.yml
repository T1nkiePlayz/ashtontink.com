name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    name: Validate HTML, links and styles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stdlib-only checker: tag balance, meta tags, internal links,
      # duplicate ids, class/CSS consistency and markdown-fence detection.
      - name: Run site checks
        run: python3 check_site.py
